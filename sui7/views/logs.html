<div class="glass-card p-6 min-h-[500px] view-transition-enter max-w-6xl mx-auto">
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6 border-b border-gray-800 pb-5">
        <div>
            <h3 class="text-xl font-semibold text-white flex items-center gap-2 mb-1">
                <i class="ph ph-terminal-window text-blue-400"></i> Real-Time Audit Logs
            </h3>
            <p class="text-gray-400 text-sm">Live streaming event telemetry across edge network nodes.</p>
        </div>
        <div class="flex items-center gap-3">
            <div id="logsLiveBadge" class="text-xs py-1.5 px-3 rounded-md bg-green-500/10 text-green-400 font-medium inline-flex items-center gap-1.5 border border-green-500/20">
                <span class="w-1.5 h-1.5 rounded-full bg-green-400 animate-pulse"></span> LIVE STREAM
            </div>
            <button id="logsAutoRefreshBtn" class="px-3 py-1.5 rounded-lg bg-gray-800 hover:bg-gray-700 text-xs text-gray-300 border border-gray-700 flex items-center gap-1.5 transition-colors">
                <i class="ph ph-arrows-clockwise text-sm" id="logsRefreshIcon"></i> Auto 4s
            </button>
            <button id="logsClearViewBtn" class="px-3 py-1.5 rounded-lg bg-gray-800/80 hover:bg-red-500/20 text-xs text-gray-400 hover:text-red-300 border border-gray-700 transition-colors">
                <i class="ph ph-trash"></i> Clear View
            </button>
        </div>
    </div>

    <!-- FILTER TOOLBAR -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
        <div class="md:col-span-2 relative">
            <i class="ph ph-magnifying-glass absolute left-3.5 top-3 text-gray-500 text-base"></i>
            <input type="text" id="logsSearchInput" class="glass-input w-full rounded-xl pl-10 pr-4 py-2.5 text-sm" placeholder="Filter logs by IP, User ID, action, or keyword...">
        </div>
        <div class="flex items-center gap-1.5 bg-gray-900/60 p-1 rounded-xl border border-gray-800 overflow-x-auto">
            <button class="log-level-filter active px-3 py-1.5 rounded-lg text-xs font-semibold bg-blue-500/20 text-blue-300 border border-blue-500/30" data-level="all">ALL</button>
            <button class="log-level-filter px-3 py-1.5 rounded-lg text-xs font-semibold text-gray-400 hover:text-white" data-level="info">INFO</button>
            <button class="log-level-filter px-3 py-1.5 rounded-lg text-xs font-semibold text-gray-400 hover:text-white" data-level="success">SUCCESS</button>
            <button class="log-level-filter px-3 py-1.5 rounded-lg text-xs font-semibold text-gray-400 hover:text-white" data-level="warning">WARN</button>
            <button class="log-level-filter px-3 py-1.5 rounded-lg text-xs font-semibold text-gray-400 hover:text-white" data-level="error">ERROR</button>
        </div>
    </div>

    <!-- TERMINAL LOG FEED -->
    <div class="bg-gray-950/80 rounded-2xl border border-gray-800 p-4 font-mono text-xs shadow-inner overflow-hidden">
        <div id="logsTerminalFeed" class="max-h-[520px] overflow-y-auto space-y-2 pr-2 scrollbar-thin">
            <div class="p-6 text-center text-gray-500">
                <i class="ph ph-spinner animate-spin text-2xl mb-2 inline-block"></i>
                <p>Establishing contact with live telemetry gateway...</p>
            </div>
        </div>
    </div>

    <div class="flex items-center justify-between text-xs text-gray-500 mt-4 px-1">
        <span>Showing <strong id="logsCountText" class="text-gray-300">0</strong> telemetry entries</span>
        <span class="flex items-center gap-1.5"><i class="ph ph-info"></i> Logs persist dynamically via KV buffer</span>
    </div>
</div>
