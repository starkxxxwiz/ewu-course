<div class="space-y-6 view-transition-enter">

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <!-- IP Blocklist -->
        <div class="glass-card p-0 flex flex-col h-[480px]">
            <div class="p-4 border-b border-gray-800 flex justify-between items-center bg-gray-900/50 rounded-t-xl">
                <div class="flex items-center gap-2">
                    <h3 class="text-base font-semibold text-white flex items-center gap-2">
                        <i class="ph ph-shield-slash text-red-400"></i> Advanced IP Blocking
                    </h3>
                    <span id="secIpCountBadge" class="text-[10px] bg-red-500/20 text-red-300 font-mono px-2 py-0.5 rounded font-semibold">0</span>
                </div>
                <button type="button" id="unblockAllIpsBtn" class="px-2.5 py-1 rounded text-xs bg-red-500/10 text-red-400 hover:bg-red-500/20 border border-red-500/30 transition-all flex items-center gap-1 font-medium select-none">
                    <i class="ph ph-trash"></i> Unblock All
                </button>
            </div>
            <div class="p-4 bg-gray-900/30 border-b border-gray-800 backdrop-blur-md space-y-2">
                <form id="blockForm" class="flex gap-2">
                    <input type="text" id="secIpInput" placeholder="Enter remote IP or multiple (e.g. 103.55.145.126, 192.168.1.1)" class="glass-input flex-1 rounded-lg px-3.5 py-2 text-sm focus:border-red-500 focus:ring-1 focus:ring-red-500" required>
                    <button type="submit" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 rounded-lg px-4 py-2 font-medium text-xs transition-all flex items-center gap-1.5 flex-shrink-0">
                        <i class="ph ph-prohibit font-bold text-sm"></i> Block IP(s)
                    </button>
                </form>
                <div class="relative">
                    <i class="ph ph-magnifying-glass absolute left-3 top-2.5 text-gray-500 text-xs"></i>
                    <input type="text" id="secIpSearchInput" placeholder="Filter active blocked IPs..." class="glass-input w-full rounded-md pl-8 pr-3 py-1.5 text-xs bg-gray-950/40">
                </div>
            </div>
            <div class="flex-1 overflow-y-auto p-4 hidden-scrollbar">
                <div id="secBlockedList" class="flex flex-col gap-2">
                    <div class="text-center text-gray-500 py-6 text-xs">Loading blocked entities...</div>
                </div>
            </div>
        </div>

        <!-- User ID Blocklist -->
        <div class="glass-card p-0 flex flex-col h-[480px]">
            <div class="p-4 border-b border-gray-800 flex justify-between items-center bg-gray-900/50 rounded-t-xl">
                <div class="flex items-center gap-2">
                    <h3 class="text-base font-semibold text-white flex items-center gap-2">
                        <i class="ph ph-user-minus text-amber-400"></i> User ID Restrictions
                    </h3>
                    <span id="secUserIdCountBadge" class="text-[10px] bg-amber-500/20 text-amber-300 font-mono px-2 py-0.5 rounded font-semibold">0</span>
                </div>
                <button type="button" id="unblockAllUserIdsBtn" class="px-2.5 py-1 rounded text-xs bg-amber-500/10 text-amber-400 hover:bg-amber-500/20 border border-amber-500/30 transition-all flex items-center gap-1 font-medium select-none">
                    <i class="ph ph-trash"></i> Unblock All
                </button>
            </div>
            <div class="p-4 bg-gray-900/30 border-b border-gray-800 backdrop-blur-md space-y-2">
                <form id="userIdBlockForm" class="flex gap-2">
                    <input type="text" id="secUserIdInput" placeholder="Enter Student ID (e.g. 2025-2-60-331)" class="glass-input flex-1 rounded-lg px-3.5 py-2 text-sm focus:border-amber-500 focus:ring-1 focus:ring-amber-500" required>
                    <button type="submit" class="bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 border border-amber-500/30 rounded-lg px-4 py-2 font-medium text-xs transition-all flex items-center gap-1.5 flex-shrink-0">
                        <i class="ph ph-lock font-bold text-sm"></i> Restrict ID(s)
                    </button>
                </form>
                <div class="relative">
                    <i class="ph ph-magnifying-glass absolute left-3 top-2.5 text-gray-500 text-xs"></i>
                    <input type="text" id="secUserIdSearchInput" placeholder="Filter restricted user IDs..." class="glass-input w-full rounded-md pl-8 pr-3 py-1.5 text-xs bg-gray-950/40">
                </div>
            </div>
            <div class="flex-1 overflow-y-auto p-4 hidden-scrollbar">
                <div id="secBlockedUserIdList" class="flex flex-col gap-2">
                    <div class="text-center text-gray-500 py-6 text-xs">Loading blocked User IDs...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Live Successful User Logins Table -->
    <div class="glass-card p-0 flex flex-col min-h-[400px]">
        <div class="p-4 border-b border-gray-800 flex flex-col sm:flex-row justify-between sm:items-center gap-3 bg-gray-900/50 rounded-t-xl">
            <div class="flex items-center gap-3">
                <h3 class="text-base font-semibold text-white flex items-center gap-2">
                    <i class="ph ph-user-check text-green-400"></i> Live Authenticated User ID Logins
                </h3>
                <span class="text-xs text-gray-400 bg-gray-800/60 px-2.5 py-0.5 rounded-full flex items-center gap-1.5 border border-gray-700">
                    <span class="w-1.5 h-1.5 rounded-full bg-green-400 animate-pulse"></span> Active Buffer
                </span>
            </div>
            <div class="flex items-center gap-2">
                <div class="relative">
                    <i class="ph ph-magnifying-glass absolute left-3 top-2.5 text-gray-500 text-xs"></i>
                    <input type="text" id="secLoginSearchInput" placeholder="Search user ID or IP..." class="glass-input rounded-lg pl-8 pr-3 py-1.5 text-xs w-48 sm:w-60">
                </div>
                <button id="exportLoginsCsvBtn" class="px-2.5 py-1.5 rounded-lg bg-gray-800 hover:bg-gray-700 text-xs text-gray-300 border border-gray-700 flex items-center gap-1 font-medium transition-all" title="Export Logins CSV">
                    <i class="ph ph-download-simple text-emerald-400"></i> CSV
                </button>
            </div>
        </div>
        <div class="flex-1 overflow-x-auto">
            <table class="w-full text-left relative font-sans">
                <thead class="text-xs text-gray-400 bg-gray-900/80 sticky top-0 backdrop-blur z-10 border-b border-gray-800 uppercase tracking-wider">
                    <tr>
                        <th class="px-5 py-3 font-medium">User ID</th>
                        <th class="px-5 py-3 font-medium">IP Address</th>
                        <th class="px-5 py-3 font-medium">Platform</th>
                        <th class="px-5 py-3 font-medium">Total Logins</th>
                        <th class="px-5 py-3 font-medium">Timestamp</th>
                        <th class="px-5 py-3 font-medium text-right">Quick Action</th>
                    </tr>
                </thead>
                <tbody id="secUserLoginsTable" class="text-xs divide-y divide-gray-800/50">
                    <tr><td colspan="6" class="px-5 py-8 text-center text-gray-500">Retrieving successful authentication records...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
