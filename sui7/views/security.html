<div class="space-y-6 view-transition-enter">

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <!-- IP Blocklist -->
        <div class="glass-card p-0 flex flex-col h-[440px]">
            <div class="p-4 border-b border-gray-800 flex justify-between items-center bg-gray-900/50 rounded-t-xl">
                <h3 class="text-base font-semibold text-white flex items-center gap-2">
                    <i class="ph ph-shield-slash text-red-400"></i> Advanced IP Blocking
                </h3>
            </div>
            <div class="p-4 bg-gray-900/30 border-b border-gray-800 backdrop-blur-md">
                <form id="blockForm" class="flex gap-2">
                    <input type="text" id="secIpInput" placeholder="Enter remote IP (e.g. 192.168.1.1)" class="glass-input flex-1 rounded-lg px-3.5 py-2 text-sm focus:border-red-500 focus:ring-1 focus:ring-red-500" required>
                    <button type="submit" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 rounded-lg px-4 py-2 font-medium text-xs transition-all flex items-center gap-1.5">
                        <i class="ph ph-prohibit font-bold text-sm"></i> Block IP
                    </button>
                </form>
            </div>
            <div class="flex-1 overflow-y-auto p-4 hidden-scrollbar">
                <div id="secBlockedList" class="flex flex-col gap-2">
                    <div class="text-center text-gray-500 py-6 text-xs">Loading blocked entities...</div>
                </div>
            </div>
        </div>

        <!-- User ID Blocklist -->
        <div class="glass-card p-0 flex flex-col h-[440px]">
            <div class="p-4 border-b border-gray-800 flex justify-between items-center bg-gray-900/50 rounded-t-xl">
                <h3 class="text-base font-semibold text-white flex items-center gap-2">
                    <i class="ph ph-user-minus text-amber-400"></i> User ID Restrictions
                </h3>
            </div>
            <div class="p-4 bg-gray-900/30 border-b border-gray-800 backdrop-blur-md">
                <form id="userIdBlockForm" class="flex gap-2">
                    <input type="text" id="secUserIdInput" placeholder="Enter User ID (e.g. 2025-2-60-331)" class="glass-input flex-1 rounded-lg px-3.5 py-2 text-sm focus:border-amber-500 focus:ring-1 focus:ring-amber-500" required>
                    <button type="submit" class="bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 border border-amber-500/30 rounded-lg px-4 py-2 font-medium text-xs transition-all flex items-center gap-1.5">
                        <i class="ph ph-lock font-bold text-sm"></i> Restrict ID
                    </button>
                </form>
            </div>
            <div class="flex-1 overflow-y-auto p-4 hidden-scrollbar">
                <div id="secBlockedUserIdList" class="flex flex-col gap-2">
                    <div class="text-center text-gray-500 py-6 text-xs">Loading blocked User IDs...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Live Successful User Logins Table -->
    <div class="glass-card p-0 flex flex-col min-h-[380px]">
        <div class="p-4 border-b border-gray-800 flex justify-between items-center bg-gray-900/50 rounded-t-xl">
            <h3 class="text-base font-semibold text-white flex items-center gap-2">
                <i class="ph ph-user-check text-green-400"></i> Live Authenticated User ID Logins
            </h3>
            <span class="text-xs text-gray-400 bg-gray-800/60 px-2.5 py-1 rounded-full flex items-center gap-1.5 border border-gray-700">
                <span class="w-1.5 h-1.5 rounded-full bg-green-400 animate-pulse"></span> Active Buffer
            </span>
        </div>
        <div class="flex-1 overflow-x-auto">
            <table class="w-full text-left relative font-sans">
                <thead class="text-xs text-gray-400 bg-gray-900/80 sticky top-0 backdrop-blur z-10 border-b border-gray-800 uppercase tracking-wider">
                    <tr>
                        <th class="px-5 py-3 font-medium">User ID</th>
                        <th class="px-5 py-3 font-medium">IP Address</th>
                        <th class="px-5 py-3 font-medium">Platform</th>
                        <th class="px-5 py-3 font-medium">Total Logins</th>
                        <th class="px-5 py-3 font-medium">Timestamp</th>
                        <th class="px-5 py-3 font-medium text-right">Quick Action</th>
                    </tr>
                </thead>
                <tbody id="secUserLoginsTable" class="text-xs divide-y divide-gray-800/50">
                    <tr><td colspan="6" class="px-5 py-8 text-center text-gray-500">Retrieving successful authentication records...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
